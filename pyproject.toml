[project]
name = "automation-entities"
version = "0.1.2"
authors = [
  { name="Michael Renken", email="michaelarenken@gmail.com" },
]
description = "Automate routines in a descriptive way"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.34.2",
    "selenium>=4.51.0",
    "undetected-chromedriver>=3.5.5",
]

[project.urls]
Homepage = "https://github.com/SudoVim/automation-entities"
Issues = "https://github.com/SudoVim/automation-entities/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "black>=26.10.1",
    "build>=1.6.1",
    "bump2version>=1.0.1",
    "isort>=9.0.2",
    "pytest-cov>=7.1.0",
    "setuptools>=84.0.0",
    "sphinx>=8.1.3",
    "twine>=7.0.0",
]
