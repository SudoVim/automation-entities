[project]
name = "automation-entities"
version = "0.1.1"
authors = [
  { name="Michael Renken", email="michaelarenken@gmail.com" },
]
description = "Automate routines in a descriptive way"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/SudoVim/automation-entities"
Issues = "https://github.com/SudoVim/automation-entities/issues"
